name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate SKILL.md frontmatter
        run: |
          find skills -name "SKILL.md" | while read f; do
            if ! grep -q "^name:" "$f"; then
              echo "ERROR: $f — 'name' 필드 누락"
              exit 1
            fi
            if ! grep -q "^description:" "$f"; then
              echo "ERROR: $f — 'description' 필드 누락"
              exit 1
            fi
            echo "OK: $f"
          done

  build:
    name: Build Site
    runs-on: ubuntu-latest
    needs: validate
    env:
      SKILL_SOURCES: ${{ vars.SKILL_SOURCES }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME || 'Agent Skills' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://byeonggi.github.io/skills' }}
      NEXT_PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
      NEXT_PUBLIC_GITHUB_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build registry
        run: pnpm --filter @byeonggi/skills-site exec tsx ../../scripts/build-registry.ts

      - name: Build site (SSG)
        run: pnpm --filter @byeonggi/skills-site build

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
